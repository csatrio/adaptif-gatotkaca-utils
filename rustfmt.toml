# Same rules as the other adaptif-gatotkaca crates (gatotkaca-python, adaptif-gatotkaca-runtime).
# Stable options only, so `cargo fmt` behaves the same on the stable and pinned toolchains.
edition = "2024"
max_width = 140
use_small_heuristics = "Max"
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
