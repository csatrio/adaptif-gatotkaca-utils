[package]
name = "adaptif-gatotkaca-utils"
version = "0.12.0"
edition = "2024"
rust-version = "1.85"
description = "Low-level building blocks used by the adaptif-gatotkaca transport system: a no-hash u64 map, intrusive ref-counted pointers, a lock-free Treiber stack, and a many-producer single-consumer channel built on it."
license = "MIT OR Apache-2.0"
homepage = "https://adaptif.co.id/"
repository = "https://github.com/csatrio/adaptif-gatotkaca-utils"
documentation = "https://docs.rs/adaptif-gatotkaca-utils"
readme = "README.md"
keywords = ["lock-free", "treiber", "refcount", "hashmap", "atomic"]
categories = ["data-structures", "concurrency"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
crossbeam-utils = "0.8"
nohash-hasher = "0.2.0"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[[bench]]
name = "treiber"
harness = false
